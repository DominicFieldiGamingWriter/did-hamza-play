name: One-off 404 diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-404.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production page and test referenced URLs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import subprocess
          import urllib.parse
          from html.parser import HTMLParser

          base = os.environ["SITE_URL"].rstrip("/")
          html_path = "/tmp/home.html"
          out_path = "404-debug-result.txt"

          def fetch(url, output=None):
              cmd = ["curl", "-L", "--silent", "--show-error", "--max-time", "20",
                     "--retry", "2", "-o", output or "/dev/null",
                     "-w", "%{http_code}\t%{url_effective}", url]
              return subprocess.check_output(cmd, text=True).strip()

          home_result = fetch(base + "/", html_path)

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()
              def handle_starttag(self, tag, attrs):
                  for k, v in attrs:
                      if k in ("src", "href") and v:
                          self.urls.add(v)

          parser = Parser()
          parser.feed(open(html_path, encoding="utf-8", errors="ignore").read())

          candidates = {
              "/favicon.ico",
              "/robots.txt",
              "/sitemap.xml",
              "/manifest.json",
              "/manifest.webmanifest",
              "/apple-touch-icon.png",
          }

          for raw in parser.urls:
              if raw.startswith("data:") or raw.startswith("mailto:") or raw.startswith("javascript:") or raw.startswith("#"):
                  continue
              absolute = urllib.parse.urljoin(base + "/", raw)
              parts = urllib.parse.urlsplit(absolute)
              base_parts = urllib.parse.urlsplit(base)
              if parts.scheme in ("http", "https") and parts.netloc == base_parts.netloc:
                  candidates.add(urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, parts.query, "")))

          results = []
          for url in sorted(candidates):
              try:
                  result = fetch(url)
                  code, final = result.split("\t", 1)
                  results.append((code, url, final))
              except subprocess.CalledProcessError as e:
                  results.append(("CURL_ERROR", url, str(e)))

          with open(out_path, "w", encoding="utf-8") as f:
              f.write(f"Production homepage: {base}/\n")
              f.write(f"Homepage response: {home_result}\n\n")
              f.write("NON-2XX RESPONSES\n")
              bad = [r for r in results if not re.fullmatch(r"2\\d\\d", r[0] or "")]
              if bad:
                  for code, url, final in bad:
                      f.write(f"{code}\t{url}\t{final}\n")
              else:
                  f.write("None found among discovered same-origin URLs and standard endpoints.\n")
              f.write("\nALL CHECKS\n")
              for code, url, final in results:
                  f.write(f"{code}\t{url}\t{final}\n")
          PY

      - name: Commit diagnostic result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404-debug-result.txt
          git commit -m "[skip ci] Record one-off 404 diagnostic"
          git push
