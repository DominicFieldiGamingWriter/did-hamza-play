name: One-off 404 diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-404.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch production page and test referenced URLs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail

          BASE_URL="${SITE_URL:-https://didhamzplay.com}"
          export BASE_URL

          python3 - <<'PY'
          import os
          import re
          import subprocess
          import urllib.parse
          from html.parser import HTMLParser

          base = os.environ["BASE_URL"].rstrip("/")
          parsed_base = urllib.parse.urlsplit(base)

          if parsed_base.scheme not in ("http", "https") or not parsed_base.netloc:
              raise SystemExit(f"Invalid BASE_URL: {base}")

          html_path = "/tmp/home.html"
          out_path = "404-debug-result.txt"

          def fetch(url, output=None):
              cmd = [
                  "curl",
                  "-L",
                  "--silent",
                  "--show-error",
                  "--max-time", "20",
                  "--retry", "2",
                  "-o", output or "/dev/null",
                  "-w", "%{http_code}\\t%{url_effective}",
                  url,
              ]
              return subprocess.check_output(cmd, text=True).strip()

          home_result = fetch(base + "/", html_path)

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("src", "href") and value:
                          self.urls.add(value)

          parser = Parser()
          with open(html_path, encoding="utf-8", errors="ignore") as fh:
              parser.feed(fh.read())

          candidates = {
              "/favicon.ico",
              "/robots.txt",
              "/sitemap.xml",
              "/manifest.json",
              "/manifest.webmanifest",
              "/apple-touch-icon.png",
          }

          for raw in parser.urls:
              if raw.startswith(("data:", "mailto:", "javascript:", "#")):
                  continue

              absolute = urllib.parse.urljoin(base + "/", raw)
              parts = urllib.parse.urlsplit(absolute)

              if (
                  parts.scheme in ("http", "https")
                  and parts.netloc == parsed_base.netloc
              ):
                  candidates.add(
                      urllib.parse.urlunsplit(
                          (parts.scheme, parts.netloc, parts.path, parts.query, "")
                      )
                  )

          results = []

          for url in sorted(candidates):
              try:
                  code, final = fetch(url).split("\\t", 1)
                  results.append((code, url, final))
              except subprocess.CalledProcessError as exc:
                  results.append(("CURL_ERROR", url, str(exc)))

          with open(out_path, "w", encoding="utf-8") as fh:
              fh.write(f"Production homepage: {base}/\\n")
              fh.write(f"Homepage response: {home_result}\\n\\n")
              fh.write("NON-2XX RESPONSES\\n")

              bad = [
                  row for row in results
                  if not re.fullmatch(r"2\\d\\d", row[0] or "")
              ]

              if bad:
                  for code, url, final in bad:
                      fh.write(f"{code}\\t{url}\\t{final}\\n")
              else:
                  fh.write(
                      "None found among discovered same-origin URLs and standard endpoints.\\n"
                  )

              fh.write("\\nALL CHECKS\\n")
              for code, url, final in results:
                  fh.write(f"{code}\\t{url}\\t{final}\\n")
          PY

          cat 404-debug-result.txt

      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404-debug-result.txt
          git commit -m "[skip ci] Record one-off 404 diagnostic"
          git push
