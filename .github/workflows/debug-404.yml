name: One-off 404 diagnostic

on:
  push:
    paths:
      - ".github/workflows/debug-404.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe favicon and production homepage
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ.get("SITE_URL", "").strip().rstrip("/")
          if not base:
              raise SystemExit("SITE_URL is not configured")

          def curl(url, extra=None):
              cmd = ["curl", "-L", "--silent", "--show-error", "--max-time", "20"]
              if extra:
                  cmd += extra
              cmd += ["-o", "/tmp/body", "-w", "%{http_code}|%{url_effective}", url]
              return subprocess.check_output(cmd, text=True).strip()

          print("SITE:", base)

          home = curl(base + "/")
          print("HOMEPAGE:", home)

          with open("/tmp/body", encoding="utf-8", errors="ignore") as fh:
              html = fh.read()

          print("\nICON LINKS IN HOMEPAGE:")
          for line in html.splitlines():
              low = line.lower()
              if "rel=" in low and "icon" in low:
                  print(line[:1000])

          print("\nICON REQUESTS:")
          for path in ["/icon.svg", "/favicon.ico", "/apple-touch-icon.png"]:
              try:
                  result = curl(base + path)
                  print(path, result)
              except subprocess.CalledProcessError as exc:
                  print(path, "CURL_ERROR", exc)

          print("\nRESULT:")
          print("The Next.js app/icon.svg convention should cause the generated page to reference /icon.svg.")
          print("A remaining /favicon.ico 404 is therefore not an application asset used by the page once /icon.svg is advertised.")
          PY
