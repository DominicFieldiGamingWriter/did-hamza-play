name: Refresh football data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh site data
        run: |
          curl --fail -X GET "${{ secrets.SITE_URL }}/api/refresh" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
